<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E58D2">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231E58D2%22/%3E%3Cpath d=%22M14 26v12M20 20v24M44 20v24M50 26v12M20 32h24%22 stroke=%22white%22 stroke-width=%225%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<title>Scheda palestra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{-webkit-text-size-adjust:100%}
/* Layout: logbook dell'atleta. Barra superiore con settimana e RIR, una colonna di schede esercizio, barra a schede in basso come un'app. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#131922; --muted:#5B6676; --line:#D9DFE7;
  --accent:#1E58D2; --accent-ink:#FFFFFF; --accent-soft:#E3EBFB;
  --good:#1B7A48; --good-bg:#E1F2E8; --warn:#9A5800; --warn-bg:#FBEED8; --bad:#B3222B; --bad-bg:#FAE3E4;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --surface:#161C25; --sunk:#1E2631; --ink:#E7ECF3; --muted:#94A1B3; --line:#29323F;
  --accent:#6C99FF; --accent-ink:#0A1222; --accent-soft:#1A2640;
  --good:#5BCB8A; --good-bg:#12281C; --warn:#F0B25A; --warn-bg:#2D2111; --bad:#F27B81; --bad-bg:#311518;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161C25; --sunk:#1E2631; --ink:#E7ECF3; --muted:#94A1B3; --line:#29323F;
  --accent:#6C99FF; --accent-ink:#0A1222; --accent-soft:#1A2640;
  --good:#5BCB8A; --good-bg:#12281C; --warn:#F0B25A; --warn-bg:#2D2111; --bad:#F27B81; --bad-bg:#311518;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.top h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;line-height:1.1}
.top .sub{font-size:13px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn)} .dot.err{background:var(--bad)}

main{padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted);margin:6px 0 -4px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.phase{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px}
.phase b{font-family:var(--display);font-size:20px;font-weight:700}
.phase span{font-size:14px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{border-color:var(--good)}
.card.due{border-color:var(--warn)}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exh h3{margin:0;font-size:18px;font-weight:600;line-height:1.25}
.exh .mus{font-size:13px;color:var(--muted)}
.target{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;white-space:nowrap;text-align:right}
.target small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:4px}
.note{font-size:14px;color:var(--muted)}
.last{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.pill{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--line);color:var(--ink)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}

.row{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.load{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}
.load button,.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;min-height:46px;font-size:20px;font-weight:600}
input.f,select.f{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:46px;padding:8px 10px;font-size:18px;text-align:center}
input.t{text-align:left;font-size:16px}
.reps{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.seg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.seg button{font-size:17px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:46px;padding:8px 14px;font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn:disabled{opacity:.55;cursor:default}
.status{font-size:14px;min-height:1em}
.status.ok{color:var(--good)} .status.err{color:var(--bad)}

.banner{border-radius:var(--r);padding:12px 14px;font-size:15px;background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner a{color:inherit;font-weight:600}
.banner.warnb{background:var(--warn-bg);color:var(--warn)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:15px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.banner .linkbtn{color:inherit}
.status.warn{color:var(--warn)}
.sugg{font-size:15px;border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.warm{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.wsets{font-family:var(--display);font-weight:600;font-size:19px}
.altlist{display:flex;flex-wrap:wrap;gap:6px}
.vol{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.2em;gap:10px;align-items:center;font-size:14px}
.vname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:block}
.vfill{display:block;height:100%;background:var(--accent);border-radius:5px}
.vfill.full{background:var(--good)}
.vnum{text-align:right;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05}
.stat .k{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.li:first-child{border-top:0}
.li .r{color:var(--muted);white-space:nowrap;text-align:right}
.li .grow{min-width:0}
.meal h3{font-family:var(--display);font-size:20px;margin:0}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.check .grow{min-width:0;flex:1}
.check.on .name{text-decoration:line-through;color:var(--muted)}
.check .name{font-weight:600}
.check .q{font-size:14px;color:var(--muted)}
.spark{width:100%;height:44px;display:block}
.hist{font-size:14px;color:var(--muted)}

.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--bg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.timer .time{font-family:var(--display);font-weight:700;font-size:30px;min-width:76px}
.timer .grow{flex:1;min-width:0;font-size:14px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{border:1px solid currentColor;background:none;color:inherit;border-radius:8px;min-height:40px;padding:4px 12px;font-weight:600}
.timer.end{background:var(--good);color:var(--accent-ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="grow">
    <h1>Scheda palestra</h1>
    <div class="sub" id="sub">Collegamento al foglio…</div>
  </div>
  <button class="sync" id="gear" type="button" aria-label="Impostazioni">⚙</button>
  <button class="sync" id="sync" type="button" aria-label="Aggiorna dal foglio"><span class="dot busy" id="dot"></span><span id="synctxt">Carico</span></button>
</header>

<main id="main">
  <div class="banner info">Sto leggendo la scheda dal tuo foglio Google…</div>
</main>

<div class="timer" id="timer" hidden>
  <div class="time" id="ttime">0:00</div>
  <div class="grow" id="tlabel"></div>
  <button type="button" id="tplus">+15 s</button>
  <button type="button" id="tstop">Stop</button>
</div>

<nav class="tabs" aria-label="Sezioni">
  <button type="button" data-tab="oggi"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>Allenamento</button>
  <button type="button" data-tab="peso"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9a4 4 0 0 1 6 0l-2 3"/></svg>Peso</button>
  <button type="button" data-tab="dieta"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 6V3M9 13h6"/></svg>Dieta</button>
  <button type="button" data-tab="spesa"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 11h11l2-8H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Spesa</button>
  <button type="button" data-tab="storico"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>Progressi</button>
</nav>

<script>
(function(){
const ID = "1U6NYkjbyEAgk5WHNTh5BtqmUjvHdrVLB5chXOTDQd80";
const S = "Google Sheets";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + ID + "/edit";
const DAYS = ["Lun Upper","Mar Lower","Mer Push","Gio Pull","Ven Legs"];

/* ---------- storage (solo comodità per questo telefono) ---------- */
function sget(k, d){ try{ const v = localStorage.getItem("sp_"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function sset(k, v){ try{ localStorage.setItem("sp_"+k, JSON.stringify(v)); }catch(e){} }

/* ---------- utilità ---------- */
function h(tag, attrs){ const el = document.createElement(tag); if(attrs){ for(const k in attrs){ const v = attrs[k]; if(v==null || v===false) continue;
  if(k==="class") el.className = v; else if(k==="text") el.textContent = v; else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2), v); else if(k==="style") el.setAttribute("style", v); else el.setAttribute(k, v===true ? "" : v); } }
  for(let i=2;i<arguments.length;i++){ const c = arguments[i]; if(c==null || c===false) continue; if(Array.isArray(c)) c.forEach(x=>{ if(x!=null && x!==false) el.append(x instanceof Node ? x : String(x)); }); else el.append(c instanceof Node ? c : String(c)); }
  return el; }
function num(s){ if(s==null || s==="") return null; if(typeof s==="number") return s; const t = String(s).trim().replace(/\s/g,"").replace(/\./g,"").replace(",","."); const n = parseFloat(t); return isNaN(n) ? null : n; }
function fmt(n, d){ if(n==null) return "–"; return n.toLocaleString("it-IT",{minimumFractionDigits:0, maximumFractionDigits: d==null?1:d}); }
function pad(n){ return String(n).padStart(2,"0"); }
function dstr(d){ return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); }
function parseD(s){ const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s||"")); return m ? new Date(+m[3], +m[2]-1, +m[1]) : null; }
const TODAY = dstr(new Date());
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
function restSecs(rec){ const s = String(rec||"").toLowerCase(); if(s.indexOf("jump")>=0) return 90; const m = /(\d+)/.exec(s); return m ? (+m[1])*60 : 120; }
function mmss(t){ t = Math.max(0, Math.ceil(t)); return Math.floor(t/60)+":"+pad(t%60); }

/* ---------- stato ---------- */
let mcp = null;
const st = { guida:[], scheda:[], alts:[], diario:[], diarioNext:2, peso:[], pesoNext:2, seduteNext:2, sedute:[], dieta:[], dietaRows:[], dietaTot:[], spesa:[], misure:[], misureNext:2, misDates:[], err:{}, loaded:false, pageErr:null, queue: sget("queue", []), flushing:false, lastQueueErr:null };
const ui = { tab: sget("tab","oggi"), day:null, variant: sget("variant","A (secondo)"), checks: sget("checks",{}), drafts:{}, busy:{}, status:{}, swap: sget("swap_"+dstr(new Date()), {}), altOpen:{}, calConfirm:false };

/* ---------- carichi, riscaldamento, dischi ---------- */
const BAR = { "Squat":20, "Stacco rumeno":20, "Panca piana bilanciere":20, "Rematore bilanciere":20, "Lento bilanciere":20, "Good morning":20, "Curl bilanciere EZ":10 };
const PLATES = [25,20,15,10,5,2.5,1.25];
function isCompound(ex){ return String(ex.rir35)==="1-2"; }
function incFor(name, ex){ return BAR[name] ? 2.5 : (isCompound(ex) ? 2 : 1); }
function roundTo(x, inc){ return Math.round(Math.round(x/inc)*inc*100)/100; }
function suggest(ex, name, last){
  if(!last || last.carico==null || last.carico<=0) return null;
  const inc = incFor(name, ex), c = last.carico;
  if(/^Aumenta/.test(last.next)){ let kg = roundTo(c*(isCompound(ex)?1.025:1.05), inc); if(kg<=c) kg = roundTo(c+inc, inc); return { kg:kg, txt:"+"+fmt(kg-c)+" kg rispetto all'ultima volta" }; }
  if(/^Riduci/.test(last.next)){ let kg = roundTo(c*0.925, inc); if(kg>=c) kg = roundTo(c-inc, inc); kg = Math.max(0, kg); return { kg:kg, txt:fmt(kg-c)+" kg rispetto all'ultima volta" }; }
  return { kg:c, txt:"stesso carico, cerca una ripetizione in più" };
}
function warmup(ex, name, kg){
  if(!isCompound(ex) || name==="Trazioni" || kg==null || kg<=0) return null;
  const inc = incFor(name, ex), bar = BAR[name] || 0, out = [];
  [[0.5,8],[0.7,4],[0.85,2]].forEach(s=>{ const w = Math.max(bar, roundTo(kg*s[0], inc)); if(w < kg && !out.some(o=>o[0]===w)) out.push([w, s[1]]); });
  return out.length ? out : null;
}
function plates(kg, bar){
  if(kg==null) return "";
  if(kg < bar) return "Il bilanciere da solo pesa "+fmt(bar)+" kg";
  let side = Math.round((kg-bar)/2*100)/100; const used = [];
  PLATES.forEach(p=>{ while(side >= p - 0.001){ used.push(p); side = Math.round((side-p)*100)/100; } });
  const base = used.length ? "Per lato: "+used.map(p=>fmt(p,2)).join(" + ") : "Solo il bilanciere";
  return base + " (bilanciere da "+fmt(bar)+" kg)" + (side>0.01 ? ". Non esatto: mancano "+fmt(side,2)+" kg per lato" : "");
}
{ const wd = new Date().getDay(); ui.day = (wd>=1 && wd<=5) ? DAYS[wd-1] : sget("day", DAYS[0]); }

/* ---------- messaggi d'errore per codice ---------- */
function errMsg(e){
  const m = e && (e.message || String(e));
  return "Non riesco a comunicare con il foglio" + (m ? ": " + String(m).slice(0,180) : "") + ".";
}

/* ---------- accesso al foglio ---------- */
let cfg = sget("cfg", null);
async function api(body){
  if(!cfg || !cfg.url || !cfg.token){ const e = new Error("collegamento non configurato: apri le impostazioni"); e.code = "tool_error"; throw e; }
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 40000);
  let r;
  try{
    r = await fetch(cfg.url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ token:cfg.token }, body)), signal:ctrl.signal, redirect:"follow" });
  }catch(e){
    clearTimeout(t);
    const n = new Error(e && e.name==="AbortError" ? "il server di Google non ha risposto entro 40 secondi" : "connessione non riuscita");
    throw n;
  }
  clearTimeout(t);
  if(!r.ok){ throw new Error("il server ha risposto con codice " + r.status); }
  let j;
  try{ j = await r.json(); }catch(e){ const x = new Error("risposta non valida: controlla che l'URL finisca con /exec e che la distribuzione sia per Chiunque"); x.code = "tool_error"; throw x; }
  if(j && j.error){ const x = new Error(j.error==="unauthorized" ? "codice segreto non valido, controlla le impostazioni" : j.error); x.code = "tool_error"; throw x; }
  return j;
}
/* Le letture chiamate insieme partono in un'unica richiesta. */
let pendingReads = null;
function read(range){
  return new Promise(function(res, rej){
    if(!pendingReads){ pendingReads = []; setTimeout(flushReads, 0); }
    pendingReads.push({ range:range, res:res, rej:rej });
  });
}
async function flushReads(){
  const batch = pendingReads; pendingReads = null;
  const ranges = Array.from(new Set(batch.map(b=>b.range)));
  try{ const j = await api({ action:"read", ranges:ranges }); const o = j.data || {}; batch.forEach(b=>b.res(o[b.range] || [])); }
  catch(e){ batch.forEach(b=>b.rej(e)); }
}
function write(range, values){ return api({ action:"write", range:range, values:values }); }

/* ---------- impostazioni del collegamento ---------- */
function renderSettings(){
  const c = h("section",{class:"card"});
  c.append(h("h3",{style:"margin:0;font-size:18px"},"Collegamento al foglio"));
  c.append(h("div",{class:"note"},"Incolla l'URL della distribuzione Apps Script (finisce con /exec) e il codice segreto creato con setup. Restano salvati solo su questo telefono."));
  const u = h("input",{class:"f t", id:"cfg-url", type:"url", inputmode:"url", autocomplete:"off", placeholder:"https://script.google.com/macros/s/…/exec", "aria-label":"URL del server", value: cfg && cfg.url || ""});
  const k = h("input",{class:"f t", id:"cfg-token", type:"password", autocomplete:"off", placeholder:"Codice segreto", "aria-label":"Codice segreto", value: cfg && cfg.token || ""});
  const status = h("div",{class:"status","aria-live":"polite"});

    if(token.length < 16){ status.className="status err"; status.textContent="Il codice segreto sembra incompleto: copialo per intero dal log di setup."; return; }

/* ---------- coda offline: ogni scrittura va su una riga precisa, quindi ripeterla è sicuro ---------- */
function saveQueue(){ sset("queue", st.queue); }
function enqueue(item){ st.queue = st.queue.filter(q=>q.range!==item.range); st.queue.push(item); saveQueue(); }
async function writeOrQueue(item){
  if(navigator.onLine === false){ enqueue(item); return { queued:true }; }
  try{ await write(item.range, item.values); st.queue = st.queue.filter(q=>q.range!==item.range); saveQueue(); return { ok:true }; }
  catch(e){ if(e && (e.code==="tool_error" || e.code==="bad_request")) throw e; enqueue(item); st.lastQueueErr = e; return { queued:true, err:e }; }
}
async function flushQueue(){
  if(st.flushing || !st.queue.length || !cfg) return;
  st.flushing = true; setSync("busy","Invio");
  let lastErr = null;
  for(const q of st.queue.slice()){
    try{ await write(q.range, q.values); st.queue = st.queue.filter(x=>x.range!==q.range); saveQueue(); }
    catch(e){ lastErr = e; break; }
  }
  st.flushing = false; st.lastQueueErr = lastErr;
  if(lastErr) setSync("err", st.queue.length+" in attesa");
  else { setSync("ok","Aggiornato"); await refreshDiario(); }
  softRender();
}
function applyQueueOverlay(){
  st.queue.forEach(q=>{
    const v = q.values[0];
    if(q.kind==="diario"){
      const e = { row:q.row, date:v[0], es:v[1], carico: v[2]===""?null:v[2], reps:[3,4,5,6].map(i=>v[i]===""?null:v[i]), rir: v[7]===""?null:v[7], note:v[8]||"", e1rm:null, next:"" };
      const ex = st.diario.find(d=>d.row===q.row); if(ex) Object.assign(ex, e); else st.diario.push(e);
      st.diario.sort((a,b)=>a.row-b.row);
      st.diarioNext = Math.max(st.diarioNext, q.row+1);
    } else if(q.kind==="peso"){
      const ex = st.peso.find(p=>p.row===q.row); if(ex) ex.kg = v[1]; else st.peso.push({ row:q.row, date:v[0], kg:v[1], media:null, vari:null });
      st.pesoNext = Math.max(st.pesoNext, q.row+1);
    } else if(q.kind==="sedute"){ st.seduteNext = Math.max(st.seduteNext, q.row+1); if(!st.sedute.some(x=>x.row===q.row)) st.sedute.push({ row:q.row, date:v[0] }); }
    else if(q.kind==="misure"){
      const e = { row:q.row, date:v[0], kg:v[1]===""?null:v[1], vita:v[2]===""?null:v[2], braccio:v[3]===""?null:v[3], petto:v[4]===""?null:v[4], coscia:v[5]===""?null:v[5], foto:v[6], note:v[7]||"" };
      const ex = st.misure.find(m=>m.row===q.row); if(ex) Object.assign(ex, e); else st.misure.push(e);
      st.misureNext = Math.max(st.misureNext, q.row+1);
    }
  });
}
function softRender(){ const a = document.activeElement; if(!(a && a.tagName==="INPUT")) render(); else { const b = document.getElementById("qbanner"); if(b) b.replaceWith(queueBanner() || h("span")); } }
function queueBanner(){
  if(!st.queue.length) return null;
  return h("div",{class:"banner warnb", id:"qbanner"},
    h("span",null, st.queue.length===1 ? "1 salvataggio è sul telefono in attesa di essere inviato al foglio." : st.queue.length+" salvataggi sono sul telefono in attesa di essere inviati al foglio."),
    " ", h("button",{type:"button", class:"linkbtn", onclick:()=>flushQueue()},"Invia ora"),
    st.lastQueueErr && navigator.onLine!==false ? h("div",{style:"margin-top:4px;font-size:13px"}, errMsg(st.lastQueueErr)) : null);
}
setInterval(()=>{ if(st.queue.length && navigator.onLine!==false) flushQueue(); }, 30000);
window.addEventListener("online", ()=>flushQueue());
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") flushQueue(); });

function parseDiario(rows){
  const out = [];
  rows.forEach((r,i)=>{ if(!r || !r[1]) return;
    out.push({ row:i+2, date:r[0]||"", es:r[1], carico:num(r[2]), reps:[num(r[3]),num(r[4]),num(r[5]),num(r[6])], rir:num(r[7]), note:r[8]||"",
      sett:num(r[9]), e1rm:num(r[16]), next:r[17]||"" }); });
  return out;
}

async function loadAll(){
  setSync("busy","Carico");
  const jobs = {
    guida: read("Guida!B3:B5"), scheda: read("Scheda!A2:J60"), alts: read("Scheda!O2:R80"), diario: read("Diario!A2:R"),
    peso: read("Peso!A2:D"), sedute: read("Sedute!A2:B"), misure: read("Misure!A2:H"), misDates: read("Guida!B28:B30"),
    dieta: read("Dieta!A5:M26"), dietaTot: read("Dieta!C30:H31"), spesa: read("Spesa!A9:H20")
  };
  const keys = Object.keys(jobs);
  const res = await Promise.allSettled(keys.map(k=>jobs[k]));
  st.err = {}; const codes = [];
  res.forEach((r,i)=>{ const k = keys[i];
    if(r.status==="rejected"){ st.err[k] = r.reason; codes.push(r.reason && r.reason.code); return; }
    const v = r.value;
    if(k==="guida") st.guida = v;
    else if(k==="scheda") st.scheda = v.filter(x=>x && x[1]).map(x=>({ giorno:x[0], es:x[1], serie:num(x[2])||3, min:num(x[3]), max:num(x[4]), rir12:x[5]||"", rir35:x[6]||"", rec:x[7]||"", note:x[8]||"", mus:x[9]||"" }));
    else if(k==="diario"){ st.diario = parseDiario(v); st.diarioNext = 2 + v.length; }
    else if(k==="peso"){ st.peso = v.map((x,i)=>({ row:i+2, date:x[0]||"", kg:num(x[1]), media:num(x[2]), vari:num(x[3]) })).filter(x=>x.date); st.pesoNext = 2 + v.length; }
    else if(k==="sedute"){ st.sedute = v.map((x,i)=>({ row:i+2, date:x[0]||"" })); st.seduteNext = 2 + v.length; }
    else if(k==="misure"){ st.misure = v.map((x,i)=>({ row:i+2, date:x[0]||"", kg:num(x[1]), vita:num(x[2]), braccio:num(x[3]), petto:num(x[4]), coscia:num(x[5]), foto:x[6]||"", note:x[7]||"" })).filter(m=>m.date); st.misureNext = 2 + v.length; }
    else if(k==="misDates") st.misDates = v;
    else if(k==="alts") st.alts = v.filter(x=>x && x[0]).map(x=>({ es:x[0], min:num(x[1]), max:num(x[2]), mus:x[3]||"" }));
    else if(k==="dieta"){ st.dietaRows = v.map((x,i)=>({ row:i+5, r:x })).filter(o=>o.r && o.r[2]); st.dieta = st.dietaRows.map(o=>o.r); }
    else if(k==="dietaTot") st.dietaTot = v;
    else if(k==="spesa") st.spesa = v.filter(x=>x && x[0]);
  });
  applyQueueOverlay();
  const allFailed = codes.length===keys.length;
  if(allFailed && st.fromSnap){ st.err = {}; st.pageErr = null; st.stale = true; setSync("err","Non aggiornato"); }
  else {
    st.loaded = true; st.stale = false;
    st.pageErr = allFailed ? st.err[keys[0]] : null;
    if(codes.length) setSync("err","Errore"); else { setSync("ok","Aggiornato"); saveSnap(); }
  }
  render();
  if(st.queue.length) flushQueue();
}

async function refreshDiario(){
  try{ const v = await read("Diario!A2:R"); st.diario = parseDiario(v); st.diarioNext = Math.max(st.diarioNext, 2 + v.length); applyQueueOverlay(); return true; }
  catch(e){ return false; }
}

/* ---------- barra superiore ---------- */
function setSync(kind, txt){ document.getElementById("dot").className = "dot " + kind; document.getElementById("synctxt").textContent = txt; }

function phase(){
  const start = parseD(st.guida[0] && st.guida[0][0]);
  if(!start) return { w:1, label:"Settimana 1", deload:false, before:false };
  const days = Math.floor((new Date(new Date().toDateString()) - start)/86400000);
  const w = Math.floor(days/7) + 1;
  if(days < 0) return { w:1, label:"Il blocco inizia il " + dstr(start), deload:false, before:true };
  if(w === 6) return { w:6, label:"Settimana 6 di 6, scarico", deload:true };
  if(w > 6) return { w:w, label:"Blocco 1 concluso", deload:false, over:true };
  return { w:w, label:"Settimana " + w + " di 6", deload:false };
}
function updateSub(){
  const p = phase();
  document.getElementById("sub").textContent = st.loaded ? (p.label + " · " + new Date().toLocaleDateString("it-IT",{weekday:"long", day:"numeric", month:"long"})) : "Collegamento al foglio…";
}

/* ---------- Allenamento ---------- */
function lastEntry(es){ for(let i=st.diario.length-1;i>=0;i--){ const d = st.diario[i]; if(d.es===es && d.date!==TODAY) return d; } return null; }
function todayEntry(es){ for(let i=st.diario.length-1;i>=0;i--){ const d = st.diario[i]; if(d.es===es && d.date===TODAY) return d; } return null; }
function nextPill(t){ if(!t) return null; const c = /^Aumenta/.test(t) ? "good" : (/^Riduci/.test(t) ? "bad" : ""); return h("span",{class:"pill "+c}, t); }
function repsTxt(a){ return a.filter(x=>x!=null).map(x=>fmt(x,0)).join("/"); }

}

function altOptions(ex){
  const same = st.scheda.filter(x=>x.mus===ex.mus && x.es!==ex.es).map(x=>x.es);
  const alt = st.alts.filter(a=>a.mus===ex.mus && same.indexOf(a.es)<0).map(a=>a.es);
  return same.concat(alt);
}
function targetFor(name, ex){
  if(name===ex.es) return { min:ex.min, max:ex.max };
  const s = st.scheda.find(x=>x.es===name); if(s) return { min:s.min, max:s.max };
  const a = st.alts.find(x=>x.es===name); if(a) return { min:a.min, max:a.max };
  return { min:ex.min, max:ex.max };
}
function setSwap(orig, name){ if(name && name!==orig) ui.swap[orig] = name; else delete ui.swap[orig]; sset("swap_"+TODAY, ui.swap); ui.altOpen[orig] = false; render(); }

function exCard(ex, p){
  const name = ui.swap[ex.es] || ex.es;
  const swapped = name !== ex.es;
  const sets = p.deload ? Math.ceil(ex.serie/2) : ex.serie;
  const rir = p.deload ? "3" : String(p.w<=2 ? ex.rir12 : ex.rir35);
  const tg = targetFor(name, ex);
  const last = lastEntry(name), today = todayEntry(name);
  const sg = suggest(ex, name, last);
  const key = name;
  if(!ui.drafts[key]){
    ui.drafts[key] = today ? { carico: today.carico, reps: today.reps.slice(0,4), rir: today.rir, note: today.note }
      : { carico: sg ? sg.kg : (last ? last.carico : null), reps:[null,null,null,null], rir:null, note:"" };
  }
  const dr = ui.drafts[key];
  const range = (tg.min!=null && tg.max!=null) ? fmt(tg.min,0)+"–"+fmt(tg.max,0) : "";
  const card = h("section",{class:"card"+(today?" done":""), "aria-label":name});
  card.append(h("div",{class:"exh"},
    h("div",{style:"min-width:0"}, h("h3",null,name), h("div",{class:"mus"}, swapped ? "Al posto di "+ex.es : ex.mus)),
    h("div",{class:"target"}, sets+" × "+range, h("small",null,"RIR "+rir+" · "+ex.rec))));
  if(ex.note && !swapped) card.append(h("div",{class:"note"}, ex.note));
  if(last){
    card.append(h("div",{class:"last"}, h("span",null,"Ultima volta "+last.date.slice(0,5)+": "+(last.carico!=null ? fmt(last.carico)+" kg · " : "")+repsTxt(last.reps)+(last.rir!=null ? " · RIR "+fmt(last.rir,0) : "")), nextPill(last.next)));
  } else {
    card.append(h("div",{class:"last"}, h("span",null,"Prima volta: trova il carico con cui chiudi "+range+" ripetizioni lasciandone "+rir+" in canna.")));
  }
  if(sg && !today) card.append(h("div",{class:"sugg"}, h("b",null,"Oggi: "+fmt(sg.kg)+" kg"), " ("+sg.txt+")"));
  // carico, dischi, riscaldamento
  const plateEl = BAR[name] ? h("div",{class:"note"}) : null;
  const warmEl = h("div",{class:"warm"});
  const upd = ()=>{
    if(plateEl) plateEl.textContent = plates(dr.carico, BAR[name]);
    const w = warmup(ex, name, dr.carico);
    warmEl.replaceChildren(); warmEl.hidden = !w;
    if(w) warmEl.append(h("span",{class:"lbl"},"Riscaldamento"), h("span",{class:"wsets"}, w.map(x=>fmt(x[0])+" kg × "+x[1]).join("  ·  ")), h("span",{class:"note"},"Serie di avvicinamento: non contano nelle serie della scheda."));
  };
  const inp = h("input",{class:"f", id:"load-"+slug(key), type:"text", inputmode:"decimal", "aria-label":"Carico in kg", placeholder:"kg", value: dr.carico!=null ? fmt(dr.carico) : ""});
  inp.addEventListener("input", ()=>{ dr.carico = num(inp.value); upd(); });
  const inc = incFor(name, ex);
  const step = d=>{ const v = (num(inp.value)||0) + d; dr.carico = Math.max(0, Math.round(v*100)/100); inp.value = fmt(dr.carico); upd(); };
  card.append(h("div",{class:"row"}, h("span",{class:"lbl"}, name==="Trazioni" ? "Zavorra (kg)" : "Carico (kg)"),
    h("div",{class:"load"}, h("button",{type:"button","aria-label":"Togli "+fmt(inc)+" kg", onclick:()=>step(-inc)},"−"), inp, h("button",{type:"button","aria-label":"Aggiungi "+fmt(inc)+" kg", onclick:()=>step(inc)},"+"))));
  if(plateEl) card.append(plateEl);
  card.append(warmEl);
  upd();
  // ripetizioni
  const reps = h("div",{class:"reps", style:"--n:"+sets});
  for(let i=0;i<sets;i++){
    const ri = h("input",{class:"f", id:"rep-"+slug(key)+"-"+i, type:"text", inputmode:"numeric", "aria-label":"Ripetizioni serie "+(i+1), placeholder:"S"+(i+1), value: dr.reps[i]!=null ? String(dr.reps[i]) : ""});
    ri.addEventListener("input", ()=>{ dr.reps[i] = num(ri.value); });
    reps.append(ri);
  }
  card.append(h("div",{class:"row"}, h("span",{class:"lbl"},"Ripetizioni per serie"), reps));
  // RIR
  const seg = h("div",{class:"seg", style:"--n:5", role:"group", "aria-label":"RIR ultima serie"});
  [0,1,2,3,4].forEach(v=>{ const b = h("button",{type:"button", "aria-pressed": String(dr.rir===v)}, v===4?"4+":String(v));
    b.addEventListener("click", ()=>{ dr.rir = v; seg.querySelectorAll("button").forEach((x,j)=>x.setAttribute("aria-pressed", String(j===v))); }); seg.append(b); });
  card.append(h("div",{class:"row"}, h("span",{class:"lbl"},"Ripetizioni in canna nell'ultima serie"), seg));
  // nota
  const nt = h("input",{class:"f t", id:"note-"+slug(key), type:"text", "aria-label":"Nota", placeholder:"Nota: tecnica, fastidi, sensazioni", value: dr.note||""});
  nt.addEventListener("input", ()=>{ dr.note = nt.value; });
  card.append(nt);
  // azioni
  const status = h("div",{class:"status "+(ui.status[key] ? ui.status[key].k : ""), "aria-live":"polite"}, ui.status[key] ? ui.status[key].t : (today ? "Salvato oggi"+(today.next ? ". Prossima volta: "+today.next : "") : ""));
  const save = h("button",{type:"button", class:"btn primary", disabled: ui.busy[key] ? true : null}, ui.busy[key] ? "Salvo…" : (today ? "Aggiorna" : "Salva"));
  save.addEventListener("click", ()=>saveEx(name, sets, save, status));
  card.append(h("div",{class:"actions"}, h("button",{type:"button", class:"btn", onclick:()=>startTimer(restSecs(ex.rec), name)}, "Recupero "+mmss(restSecs(ex.rec))), save));
  card.append(status);
  // alternative
  if(swapped){
    card.append(h("button",{type:"button", class:"linkbtn", onclick:()=>setSwap(ex.es, null)}, "Torna a "+ex.es));
  } else {
    const opts = altOptions(ex);
    if(opts.length){
      card.append(h("button",{type:"button", class:"linkbtn", "aria-expanded":String(!!ui.altOpen[ex.es]), onclick:()=>{ ui.altOpen[ex.es] = !ui.altOpen[ex.es]; render(); }}, "Macchinario occupato? Scegli un'alternativa"));
      if(ui.altOpen[ex.es]) card.append(h("div",{class:"altlist"}, opts.map(o=>h("button",{type:"button", class:"chip", onclick:()=>setSwap(ex.es, o)}, o))));
    }
  }
  return card;
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-"); }

async function saveEx(name, sets, btn, status){
  const key = name, dr = ui.drafts[key];
  const reps = dr.reps.slice(0, sets);
  if(!reps.some(x=>x!=null)){ status.className="status err"; status.textContent="Scrivi le ripetizioni di almeno una serie."; return; }
  if(reps.some(x=>x!=null && (x<0 || x>40))){ status.className="status err"; status.textContent="Le ripetizioni vanno da 0 a 40."; return; }
  const today = todayEntry(key);
  const row = today ? today.row : st.diarioNext;
  const vals = [TODAY, key, dr.carico!=null ? dr.carico : ""];
  for(let i=0;i<4;i++) vals.push(i<sets && reps[i]!=null ? reps[i] : "");
  vals.push(dr.rir!=null ? dr.rir : ""); vals.push(dr.note||"");
  ui.busy[key] = true; btn.disabled = true; btn.textContent = "Salvo…"; status.className="status"; status.textContent="";
  let res = null;
  try{
    res = await writeOrQueue({ kind:"diario", row:row, range:"Diario!A"+row+":I"+row, values:[vals] });
    if(!today) st.diarioNext = row + 1;
    if(!sget("start_"+TODAY, null)) sset("start_"+TODAY, Date.now());
    const entry = { row:row, date:TODAY, es:key, carico:dr.carico, reps:[0,1,2,3].map(i=>i<sets?reps[i]:null), rir:dr.rir, note:dr.note||"", next:"" };
    if(today) Object.assign(today, entry); else st.diario.push(entry);

/* ---------- timer di recupero ---------- */
const T = { end:0, int:null, label:"", ctx:null, lock:null };
const tEl = document.getElementById("timer");
function beep(){ try{ if(!T.ctx) return; const o = T.ctx.createOscillator(), g = T.ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(T.ctx.destination); g.gain.setValueAtTime(0.25, T.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, T.ctx.currentTime+0.6); o.start(); o.stop(T.ctx.currentTime+0.6); }catch(e){} }
function tick(){
  const left = (T.end - Date.now())/1000;
  document.getElementById("ttime").textContent = mmss(left);
  if(left <= 0){ clearInterval(T.int); T.int = null; tEl.classList.add("end"); document.getElementById("tlabel").textContent = "Recupero finito: prossima serie"; beep(); try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){} }
}
function startTimer(secs, label){
  try{ if(!T.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) T.ctx = new AC(); } if(T.ctx && T.ctx.state==="suspended") T.ctx.resume(); }catch(e){}
  try{ if(navigator.wakeLock && !T.lock) navigator.wakeLock.request("screen").then(l=>{ T.lock=l; l.addEventListener && l.addEventListener("release",()=>{ T.lock=null; }); }).catch(()=>{}); }catch(e){}
  T.end = Date.now() + secs*1000; T.label = label;
  tEl.hidden = false; tEl.classList.remove("end");
  document.getElementById("tlabel").textContent = label;
  if(T.int) clearInterval(T.int);
  T.int = setInterval(tick, 250); tick();
}
document.getElementById("tplus").addEventListener("click", ()=>{ if(!T.int){ startTimer(15, T.label); return; } T.end += 15000; tick(); });
document.getElementById("tstop").addEventListener("click", ()=>{ if(T.int) clearInterval(T.int); T.int=null; tEl.hidden = true; try{ T.lock && T.lock.release(); }catch(e){} T.lock=null; });

/* ---------- controllo calorie ogni 2 settimane ---------- */
const DAY = 86400000;
function calorieCheck(tmin, tmax){
  const pts = st.peso.map(x=>({ d:parseD(x.date), m:x.media })).filter(p=>p.d && p.m!=null).sort((a,b)=>a.d-b.d);
  if(!pts.length) return { wait:true, first:null };
  const L = pts[pts.length-1];
  let E = null; pts.forEach(p=>{ if(p.d.getTime() <= L.d.getTime() - 14*DAY) E = p; });
  if(!E) return { wait:true, first: new Date(pts[0].d.getTime() + 14*DAY) };
  const rate = (L.m - E.m) / ((L.d - E.d) / (7*DAY));
  let action = "keep";
  if(tmin!=null && rate < tmin) action = "up"; else if(tmax!=null && rate > tmax) action = "down";
  return { wait:false, rate:rate, action:action, from:E, to:L };
}
function caloriePlan(action){
  const pasta = st.dietaRows.find(o=>/^Pasta o riso \(crudo\)/.test(o.r[2]));
  const nuts = st.dietaRows.find(o=>/^Frutta secca/.test(o.r[2]));
  const pq = pasta ? num(pasta.r[3]) : null, nq = nuts ? num(nuts.r[3]) : null;
  if(action==="up" && pasta && pq!=null) return { row:pasta.row, to:pq+40, txt:"Pasta o riso a cena da "+fmt(pq,0)+" a "+fmt(pq+40,0)+" g (circa +140 kcal)" };
  if(action==="down"){
    if(nuts && nq) return { row:nuts.row, to:0, txt:"Togli la frutta secca ("+fmt(nq,0)+" g, circa "+fmt(nq*6,0)+" kcal)" };
    if(pasta && pq!=null && pq>40) return { row:pasta.row, to:pq-40, txt:"Pasta o riso a cena da "+fmt(pq,0)+" a "+fmt(pq-40,0)+" g (circa −140 kcal)" };
  }
  return null;
}
function calorieCard(tmin, tmax){
  const c = h("section",{class:"card"});
  c.append(h("h3",{style:"margin:0;font-size:18px"},"Controllo calorie"));
  const r = calorieCheck(tmin, tmax);
  if(r.wait){
    c.append(h("div",{class:"note"}, r.first ? "Primo controllo dal "+dstr(r.first)+": servono 2 settimane di pesate." : "Il controllo parte dopo 2 settimane di pesate."));
    return c;
  }
  const pill = r.action==="keep" ? h("span",{class:"pill good"},"Mantieni") : (r.action==="up" ? h("span",{class:"pill warn"},"Aggiungi 150 kcal") : h("span",{class:"pill bad"},"Togli 150 kcal"));
  c.append(h("div",{class:"exh"}, h("div",{class:"note"}, "Dal "+dstr(r.from.d)+" al "+dstr(r.to.d)+": media da "+fmt(r.from.m,2)+" a "+fmt(r.to.m,2)+" kg, cioè "+(r.rate>0?"+":"")+fmt(r.rate,2)+" kg a settimana."), pill));
  if(r.action==="keep"){ c.append(h("div",{class:"note"},"Sei nell'obiettivo: lascia le calorie come sono.")); return c; }
  const applied = sget("calApplied", null);
  const ad = applied ? parseD(applied) : null;
  if(ad && Date.now() - ad.getTime() < 14*DAY){
    c.append(h("div",{class:"note"}, "Hai già cambiato la dieta il "+applied+". Aspetta il prossimo controllo, dal "+dstr(new Date(ad.getTime()+14*DAY))+", prima di cambiare ancora."));
    return c;
  }
  const plan = caloriePlan(r.action);
  if(!plan){ c.append(h("div",{class:"note"},"Non trovo nella scheda Dieta la pasta della cena o la frutta secca: cambia le grammature direttamente nel foglio.")); return c; }
  c.append(h("div",{class:"sugg"}, h("b",null,"Proposta: "), plan.txt));
  const status = h("div",{class:"status","aria-live":"polite"});
  const btn = h("button",{type:"button", class:"btn primary"}, ui.calConfirm ? "Conferma: aggiorna la scheda Dieta" : "Applica alla dieta");
  btn.addEventListener("click", async ()=>{
    if(!ui.calConfirm){ ui.calConfirm = true; btn.textContent = "Conferma: aggiorna la scheda Dieta"; return; }
    btn.disabled = true; btn.textContent = "Salvo…";
    try{
      await write("Dieta!D"+plan.row+":D"+plan.row, [[plan.to]]);
      sset("calApplied", TODAY); ui.calConfirm = false;
      await loadAll();
    }catch(e){ btn.disabled = false; btn.textContent = "Applica alla dieta"; ui.calConfirm = false; status.className = "status err"; status.textContent = errMsg(e); }
  });
  c.append(btn, status);
  return c;
}

/* ---------- valori dall'etichetta (codice a barre, Open Food Facts) ---------- */
const LB = { row:null, code:"", busy:false, res:null, msg:"", msgKind:"", confirm:false };
function offParse(j){
  const p = j && j.product;
  const ok = p && (j.status===1 || j.status==="success" || j.status==="success_with_warnings");
  if(!ok) return { found:false };
  const n = p.nutriments || {};
  const val = k=>{ const v = n[k]; return typeof v==="number" ? v : (v!=null && v!=="" && !isNaN(Number(v)) ? Number(v) : null); };
  let kcal = val("energy-kcal_100g"); if(kcal==null && val("energy-kj_100g")!=null) kcal = Math.round(val("energy-kj_100g")/4.184);
  return { found:true, name:p.product_name||"", brands:p.brands||"", quantity:p.quantity||"", kcal:kcal, p:val("proteins_100g"), c:val("carbohydrates_100g"), f:val("fat_100g") };
}
async function offLookup(code){
  try{
    const r = await fetch("https://world.openfoodfacts.org/api/v2/product/"+code+".json?fields=product_name,brands,quantity,nutriments");
    if(r.status===404) return { found:false };
    if(r.ok) return offParse(await r.json());
  }catch(e){}
  return (await api({ action:"barcode", code:code })).data;
}
async function scanImage(file){
  if(!("BarcodeDetector" in window)) throw new Error("questo browser non legge i codici dalle foto: scrivi le cifre a mano");
  const det = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e"] });
  const bmp = await createImageBitmap(file);
  const found = await det.detect(bmp);
  if(!found.length) throw new Error("nessun codice trovato nella foto: riprova più vicino, con il codice dritto e ben illuminato");
  return found[0].rawValue;
}

  c.append(h("div",{class:"note"},"Scegli l'alimento, poi fotografa il codice a barre della confezione o scrivi le cifre. I valori per 100 g arrivano da Open Food Facts, un database libero compilato dagli utenti: confrontali con l'etichetta prima di usarli."));
  if(LB.row==null && rows.length) LB.row = rows[0].row;
  const sel = h("select",{class:"f t", id:"lb-food", "aria-label":"Alimento da aggiornare"});
  rows.forEach(o=>{ const op = h("option",{value:String(o.row)}, o.r[2]+" ("+o.r[0]+")"); if(o.row===LB.row) op.selected = true; sel.append(op); });
  sel.addEventListener("change", ()=>{ LB.row = Number(sel.value); LB.res = null; LB.confirm = false; render(); });
  c.append(sel);
  const cur = rows.find(o=>o.row===LB.row);
  if(cur) c.append(h("div",{class:"note"}, "Valori attuali per 100 g: "+cur.r[5]+" kcal · P "+cur.r[6]+" · C "+cur.r[7]+" · G "+cur.r[8]));
  const codeIn = h("input",{class:"f", id:"lb-code", type:"text", inputmode:"numeric", placeholder:"Codice a barre", "aria-label":"Codice a barre", value:LB.code});
  codeIn.addEventListener("input", ()=>{ LB.code = codeIn.value.replace(/\D/g,""); });
  const file = h("input",{type:"file", accept:"image/*", capture:"environment", id:"lb-photo", hidden:true});
  const status = h("div",{class:"status "+LB.msgKind, "aria-live":"polite"}, LB.msg);
  const search = async ()=>{
    const code = (LB.code||"").replace(/\D/g,"");
    if(code.length<8 || code.length>14){ LB.msg = "Il codice a barre ha da 8 a 14 cifre."; LB.msgKind = "err"; render(); return; }
    LB.busy = true; LB.msg = "Cerco il prodotto…"; LB.msgKind = ""; LB.res = null; LB.confirm = false; render();
    try{
      const r = await offLookup(code);
      LB.res = r.found ? r : null;
      LB.msg = r.found ? "" : "Prodotto non trovato su Open Food Facts: inserisci i valori dell'etichetta nella scheda Dieta.";
      LB.msgKind = r.found ? "" : "warn";
    }catch(e){ LB.msg = "Ricerca non riuscita: "+(e && e.message ? e.message : e)+"."; LB.msgKind = "err"; }
    LB.busy = false; render();
  };
  file.addEventListener("change", async ()=>{
    const f = file.files && file.files[0]; if(!f) return;
    try{ LB.code = await scanImage(f); render(); await search(); }
    catch(e){ LB.msg = "Lettura non riuscita: "+e.message+"."; LB.msgKind = "err"; render(); }
  });
  c.append(h("div",{class:"actions"},
    h("button",{type:"button", class:"btn", onclick:()=>file.click(), disabled: LB.busy?true:null}, "Fotografa il codice"),
    h("div",{style:"flex:1;min-width:0"}, codeIn),
    h("button",{type:"button", class:"btn", onclick:search, disabled: LB.busy?true:null}, "Cerca")), file);
  if(LB.res){
    const r = LB.res;
    const complete = [r.kcal,r.p,r.c,r.f].every(v=>v!=null);
    c.append(h("div",{class:"last"}, h("span",null, h("b",null, (r.name||"Prodotto senza nome")+(r.brands?" · "+r.brands:"")+(r.quantity?" · "+r.quantity:"")), h("br"),
      "Per 100 g: "+(r.kcal!=null?fmt(r.kcal,0):"–")+" kcal · P "+(r.p!=null?fmt(r.p,1):"–")+" · C "+(r.c!=null?fmt(r.c,1):"–")+" · G "+(r.f!=null?fmt(r.f,1):"–"))));
    if(!complete) c.append(h("div",{class:"note"},"Mancano alcuni valori: completali dall'etichetta direttamente nella scheda Dieta."));
    else {
      const btn = h("button",{type:"button", class:"btn primary"}, LB.confirm ? "Conferma: sostituisci i valori di "+(cur?cur.r[2]:"") : "Usa questi valori");
      btn.addEventListener("click", async ()=>{
        if(!LB.confirm){ LB.confirm = true; btn.textContent = "Conferma: sostituisci i valori di "+(cur?cur.r[2]:""); return; }
        btn.disabled = true; btn.textContent = "Salvo…";
        try{
          await write("Dieta!F"+LB.row+":I"+LB.row, [[r.kcal, r.p, r.c, r.f].map(v=>Math.round(v*10)/10)]);
          LB.res = null; LB.confirm = false; LB.code = ""; LB.msg = "Valori aggiornati nella scheda Dieta."; LB.msgKind = "ok";
          await loadAll();
        }catch(e){ LB.confirm = false; LB.msg = errMsg(e); LB.msgKind = "err"; render(); }
      });
      c.append(btn);
    }
  }
  c.append(status);
  return c;
}

/* ---------- Dieta ---------- */
function renderDieta(){
  const e = secErr(["dieta","dietaTot"]); if(e) main.append(e);
  const VAR = ["A (secondo)","B (primo)"];
  main.append(h("div",{class:"chips", role:"group","aria-label":"Pranzo di oggi"},
    h("button",{type:"button", class:"chip","aria-pressed":String(ui.variant===VAR[0]), onclick:()=>{ ui.variant=VAR[0]; sset("variant",VAR[0]); render(); }},"A pranzo: secondo"),
    h("button",{type:"button", class:"chip","aria-pressed":String(ui.variant===VAR[1]), onclick:()=>{ ui.variant=VAR[1]; sset("variant",VAR[1]); render(); }},"A pranzo: primo")));
  const tot = st.dietaTot.find(r=>r[0]===ui.variant);
  if(tot){
    main.append(h("section",{class:"card"}, h("div",{class:"stats"},
      h("div",{class:"stat"}, h("div",{class:"v"}, tot[1]), h("div",{class:"k"},"kcal")),
      h("div",{class:"stat"}, h("div",{class:"v"}, tot[2]+" g"), h("div",{class:"k"},"Proteine ("+tot[5]+" g/kg)")),
      h("div",{class:"stat"}, h("div",{class:"v"}, tot[3]+" g"), h("div",{class:"k"},"Carboidrati")),
      h("div",{class:"stat"}, h("div",{class:"v"}, tot[4]+" g"), h("div",{class:"k"},"Grassi")))));
  }
  const groups = [];
  st.dieta.forEach(r=>{ if(r[1]!=="Entrambe" && r[1]!==ui.variant) return; let g = groups.find(x=>x.name===r[0]); if(!g){ g = {name:r[0], items:[]}; groups.push(g); } g.items.push(r); });
  groups.forEach(g=>{
    const kc = g.items.reduce((a,r)=>a+(num(r[9])||0),0);
    const list = h("div",{class:"list"});
    g.items.forEach(r=>{ const q = r[4]==="g" ? r[3]+" g" : r[3]+" "+r[4]; list.append(h("div",{class:"li"}, h("span",{class:"grow"}, r[2]), h("span",{class:"r"}, q))); });
    main.append(h("section",{class:"card meal"}, h("div",{class:"exh"}, h("h3",null,g.name), h("span",{class:"pill"}, fmt(kc,0)+" kcal")), list));
  });
  main.append(labelCard());
  main.append(h("div",{class:"banner info"},"Creatina monoidrato: 3-5 g al giorno, tutti i giorni. Le grammature si cambiano nella scheda Dieta del foglio."));
}

/* ---------- Spesa ---------- */
function qtyTxt(name, g){ if(g==null) return ""; const ml = /\(ml\)/.test(name); if(g>=1000) return fmt(g/1000,1)+(ml?" L":" kg"); return fmt(g,0)+(ml?" ml":" g"); }
function every(w){ if(w==null) return "Quando serve"; if(w<1) return "2 volte a settimana"; if(w===1) return "Ogni settimana"; return "Ogni "+fmt(w,0)+" settimane"; }
function renderSpesa(){
  const e = secErr(["spesa"]); if(e) main.append(e);
  const groups = {};
  st.spesa.forEach(r=>{ const w = num(r[4]); const k = every(w); (groups[k] = groups[k] || {w:w==null?99:w, items:[]}).items.push(r); });
  const order = Object.keys(groups).sort((a,b)=>groups[a].w-groups[b].w);
  if(!order.length){ main.append(h("div",{class:"banner info"},"La lista della spesa è vuota.")); return; }
  order.forEach(k=>{
    const list = h("div",{class:"list"});
    groups[k].items.forEach(r=>{
      const name = r[0], packs = r[6], g = num(r[5]);
      const id = "chk-"+slug(name); const on = !!ui.checks[name];
      const cb = h("input",{type:"checkbox", id:id}); cb.checked = on;
      const row = h("label",{class:"check"+(on?" on":""), for:id}, cb, h("span",{class:"grow"}, h("span",{class:"name"}, name.replace(/\s*\((ml|1 [^)]*)\)/g,"")), h("span",{class:"q", style:"display:block"}, qtyTxt(name,g)+(packs ? " · "+packs+(/banan|mel/i.test(name)?" pezzi":" confezioni") : "")+(r[7] ? " · "+r[7] : ""))));
      cb.addEventListener("change", ()=>{ if(cb.checked) ui.checks[name]=true; else delete ui.checks[name]; sset("checks", ui.checks); row.classList.toggle("on", cb.checked); });
      list.append(row);
    });
    main.append(h("div",{class:"eyebrow"},k), h("section",{class:"card"}, list));
  });
  main.append(h("button",{type:"button", class:"btn", onclick:()=>{ ui.checks = {}; sset("checks", ui.checks); render(); }},"Togli tutte le spunte"));
  main.append(h("p",{class:"note", style:"margin:0"},"Le spunte restano solo su questo telefono. Le quantità vengono dalla scheda Spesa del foglio."));
}

/* ---------- Progressi ---------- */
function spark(vals){
  const W = 240, H = 44, P = 4;
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const span = hi - lo || 1;
  const pts = vals.map((v,i)=>[P + (vals.length===1 ? 0 : i*(W-2*P)/(vals.length-1)), H - P - (v-lo)*(H-2*P)/span]);
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("class","spark"); svg.setAttribute("preserveAspectRatio","none"); svg.setAttribute("aria-hidden","true");
  const area = document.createElementNS(svg.namespaceURI,"path");
  area.setAttribute("d","M"+pts[0][0]+","+(H-P)+" L"+pts.map(p=>p[0]+","+p[1]).join(" L")+" L"+pts[pts.length-1][0]+","+(H-P)+" Z");
  area.setAttribute("fill","var(--accent-soft)"); area.setAttribute("stroke","none");
  const line = document.createElementNS(svg.namespaceURI,"polyline");
  line.setAttribute("points", pts.map(p=>p.join(",")).join(" ")); line.setAttribute("fill","none"); line.setAttribute("stroke","var(--accent)"); line.setAttribute("stroke-width","2"); line.setAttribute("vector-effect","non-scaling-stroke");
  svg.append(area, line);
  return svg;
}
function renderStorico(){
  const e = secErr(["diario","scheda"]); if(e) main.append(e);
  main.append(volumeCard());
  main.append(h("div",{class:"note"},"Massimale stimato (e1RM, formula di Epley) dalle ripetizioni della serie peggiore più il RIR. Serve per vedere la tendenza, non come valore esatto."));
  let any = false;
  DAYS.forEach(day=>{
    const exs = st.scheda.filter(x=>x.giorno===day);
    const cards = [];
    exs.forEach(ex=>{
      const ent = st.diario.filter(d=>d.es===ex.es);
      if(!ent.length) return; any = true;
      const vals = ent.map(d=>d.e1rm).filter(v=>v!=null);
      const lastE = ent[ent.length-1];
      const first = vals[0], lastV = vals[vals.length-1];
      const delta = (vals.length>1) ? lastV-first : null;
      const c = h("section",{class:"card"});
      c.append(h("div",{class:"exh"}, h("h3",null,ex.es), h("div",{class:"target"}, lastV!=null ? fmt(lastV)+" kg" : "–", h("small",null, delta!=null ? (delta>=0?"+":"")+fmt(delta)+" kg dall'inizio" : "e1RM"))));
      if(vals.length>1) c.append(spark(vals.slice(-20)));
      c.append(h("div",{class:"hist"}, ent.slice(-4).reverse().map(d=>d.date.slice(0,5)+": "+(d.carico!=null?fmt(d.carico)+" kg × ":"")+repsTxt(d.reps)).join(" · ")));
      cards.push(c);
    });
    if(cards.length){ main.append(h("div",{class:"eyebrow"},day)); cards.forEach(x=>main.append(x)); }
  });
  const known = new Set(st.scheda.map(x=>x.es));
  const others = [];
  st.diario.forEach(d=>{ if(!known.has(d.es) && others.indexOf(d.es)<0) others.push(d.es); });
  if(others.length){
    any = true;
    main.append(h("div",{class:"eyebrow"},"Esercizi alternativi"));
    others.forEach(name=>{
      const ent = st.diario.filter(d=>d.es===name);
      const vals = ent.map(d=>d.e1rm).filter(v=>v!=null);
      const c = h("section",{class:"card"});
      c.append(h("div",{class:"exh"}, h("h3",null,name), h("div",{class:"target"}, vals.length ? fmt(vals[vals.length-1])+" kg" : "–", h("small",null,"e1RM"))));
      if(vals.length>1) c.append(spark(vals.slice(-20)));
      c.append(h("div",{class:"hist"}, ent.slice(-4).reverse().map(d=>d.date.slice(0,5)+": "+(d.carico!=null?fmt(d.carico)+" kg × ":"")+repsTxt(d.reps)).join(" · ")));
      main.append(c);
    });
  }
  if(!any) main.append(h("div",{class:"banner info"},"Qui vedrai l'andamento di ogni esercizio dopo i primi salvataggi."));
}

/* ---------- volume della settimana ---------- */
function muscleOf(name){ const s = st.scheda.find(x=>x.es===name); if(s) return s.mus; const a = st.alts.find(x=>x.es===name); return a ? a.mus : ""; }
function volumeCard(){
  const p = phase();
  const now = new Date(new Date().toDateString());
  const monday = new Date(now.getTime() - ((now.getDay()+6)%7)*DAY);
  const sunday = new Date(monday.getTime() + 6*DAY);
  const planned = {}, done = {};
  st.scheda.forEach(x=>{ if(!x.mus) return; planned[x.mus] = (planned[x.mus]||0) + (p.deload ? Math.ceil(x.serie/2) : x.serie); });
  st.diario.forEach(d=>{ const dd = parseD(d.date); if(!dd || dd < monday || dd > sunday) return; const m = muscleOf(d.es); if(!m) return; done[m] = (done[m]||0) + d.reps.filter(r=>r!=null).length; });
  const c = h("section",{class:"card"});
  c.append(h("div",{class:"exh"}, h("h3",null,"Volume di questa settimana"), h("span",{class:"pill"}, dstr(monday).slice(0,5)+" – "+dstr(sunday).slice(0,5))));
  const list = h("div",{class:"vol"});
  Object.keys(planned).forEach(m=>{
    const pl = planned[m], dn = done[m]||0, pct = Math.min(100, pl ? dn/pl*100 : 0);
    list.append(h("div",{class:"vrow"}, h("span",{class:"vname"}, m), h("span",{class:"vbar"}, h("span",{class:"vfill"+(dn>=pl?" full":""), style:"width:"+pct.toFixed(0)+"%"})), h("span",{class:"vnum"}, dn+"/"+pl)));
  });
  c.append(list);
  c.append(h("div",{class:"note"},"Serie allenanti registrate rispetto a quelle previste dalla scheda, contando anche gli esercizi alternativi."));
  return c;
}

/* ---------- navigazione ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click", ()=>{ ui.tab = b.dataset.tab; sset("tab", ui.tab); render(); window.scrollTo(0,0); }));

/* ---------- copia locale: l'app si apre subito con gli ultimi dati, poi si aggiorna ---------- */
const SNAP_KEYS = ["guida","scheda","alts","diario","diarioNext","peso","pesoNext","seduteNext","sedute","dieta","dietaRows","dietaTot","spesa","misure","misureNext","misDates"];
function saveSnap(){ const o = { t: Date.now() }; SNAP_KEYS.forEach(k=>{ o[k] = st[k]; }); sset("snap", o); }
function loadSnap(){
  const o = sget("snap", null);
  if(!o || !o.scheda) return;
  SNAP_KEYS.forEach(k=>{ if(o[k]!==undefined) st[k] = o[k]; });
  st.snapTime = o.t; st.fromSnap = true; st.loaded = true;
  applyQueueOverlay();
}

/* ---------- avvio ---------- */
if(ui.tab==="impostazioni") ui.tab = "oggi";
loadSnap();
st.booted = true;
render();
if(cfg) loadAll(); else setSync("err","Da configurare");
})();
